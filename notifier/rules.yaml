# ============================================================
# 股票消息提醒规则
# 渠道与 webhook 配置放 .env（NOTIFY_CHANNEL / FEISHU_WEBHOOK_URL /
# WECOM_WEBHOOK_URL），不写在这里（避免泄露）。
# ============================================================

channel: "feishu"              # feishu | wecom

# ── 自选股价格阈值提醒（--price / --all）──────────────────
# code 格式: sh600519 / sz300750（腾讯报价用）
# price_above / price_below: 价格突破/跌破提醒（null=不启用）
# change_pct: 单日涨跌幅绝对值超此值提醒（null=不启用）
watchlist:
  - code: sh600519
    name: 贵州茅台
    price_above: 1500          # 突破 1500 提醒
    price_below: 1300          # 跌破 1300 提醒
    change_pct: 5              # 单日涨跌超 5% 提醒
  - code: sz300750
    name: 宁德时代
    price_above: 400
    change_pct: 6
  # 加更多自选股:
  # - code: sz000001
  #   name: 平安银行
  #   price_above: 13

# ── 资金流信号提醒（--fundflow / --all）───────────────────
fundflow:
  enable: true
  sustained_top: 10            # 持续流入榜推送前 N
  divergent_top: 5             # 背离警示（价涨钱走）前 N
  min_net_yi: 3                # 净额低于此(亿)不提醒，过滤噪音

# ── 每日盘后汇总（--daily / --all）────────────────────────
daily:
  enable: true
  include_screener: false      # 是否附带初筛结果摘要（未实现,保留配置位）
