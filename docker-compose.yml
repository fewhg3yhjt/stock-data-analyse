# StockInvestmentTool — 单容器生产部署（web + 每日定时任务内置）
# 所有路径相对本目录（部署文件与代码同层）
# ⚠️ 数据安全：output/ 挂载宿主机，执行 down/up 不丢数据。切勿 `docker compose down -v`。
services:
  stock-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-invest:latest
    container_name: stock-invest
    ports:
      - "9000:9000"
    # 环境变量：登录 / webhook / 每日任务时间 / DeepSeek 等
    env_file:
      - path: ${STOCK_ENV_FILE:-./.env}
        required: false
    environment:
      - TZ=Asia/Shanghai
      # Unified task/data management state. Legacy job_runs/meta.db remain archived for rollback.
      - MANAGEMENT_DB_PATH=/app/StockInvestmentTool/output/data/management.db
      # Temporary operator-approved bypass; remove this line to restore login.
      - STOCK_DISABLE_AUTH=1
      # 代码挂载模式下避免在宿主机代码目录生成 __pycache__
      - PYTHONDONTWRITEBYTECODE=1
    # 运行数据持久化（portfolio.db / 缓存 / 报表；切勿 down -v）
    # 代码挂载：宿主机代码直接映射进容器，改代码后只需 restart，无需 rebuild
    volumes:
      - ${STOCK_OUTPUT_DIR:-./output}:/app/StockInvestmentTool/output
      - ./:/app/StockInvestmentTool
    restart: unless-stopped
    # Keep a runaway pandas/backtest request from consuming the host memory.
    # The host has 2 GiB and other services run alongside this container.
    mem_limit: ${STOCK_MEMORY_LIMIT:-1g}
    memswap_limit: ${STOCK_MEMORY_SWAP_LIMIT:-1536m}
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  business-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-invest:latest
    container_name: stock-invest-business-worker
    env_file:
      - path: ${STOCK_ENV_FILE:-./.env}
        required: false
    environment:
      - TZ=Asia/Shanghai
      - MANAGEMENT_DB_PATH=/app/StockInvestmentTool/output/data/management.db
      - BUSINESS_DB_PATH=/app/StockInvestmentTool/output/data/business.db
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ${STOCK_OUTPUT_DIR:-./output}:/app/StockInvestmentTool/output
      - ./:/app/StockInvestmentTool
    working_dir: /app
    command: ["python", "-m", "StockInvestmentTool.biz.worker", "--poll-interval", "${BUSINESS_WORKER_POLL_INTERVAL:-2}"]
    restart: unless-stopped
    mem_limit: ${STOCK_WORKER_MEMORY_LIMIT:-512m}
    memswap_limit: ${STOCK_WORKER_MEMORY_SWAP_LIMIT:-768m}
    pids_limit: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; p='/app/StockInvestmentTool/output/data/business.db'; c=sqlite3.connect(p); assert c.execute('PRAGMA quick_check').fetchone()[0] == 'ok'; c.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
