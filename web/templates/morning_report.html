{% extends "base.html" %}
{% block title %}StockInvestmentTool - 每日晨报{% endblock %}
{% block head %}
<script src="https://cdn.bootcdn.net/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://unpkg.com/marked/marked.min.js"></script>
<link rel="stylesheet" href="{{ static_asset('morning-report.css') }}">
<script src="{{ static_asset('morning-report.js') }}" defer></script>
{% endblock %}
{% block body %}
<div class="app">
  <div class="header">
    <div>
      <h1><i class="fas fa-newspaper"></i> 晨报 <span style="font-size:14px;color:var(--color-text-subtle);font-weight:400;">{{ today }}</span></h1>
    </div>
    {% set active = '' %}{% include '_nav.html' %}
  </div>
  <div class="ui-card">
    <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
      <button class="ui-button ui-button-primary" id="generate-report"><i class="fas fa-sync"></i> 重新生成（刷新行情）</button>
    </div>
    {% if content %}
    <div id="content"></div>
    {% else %}
    <div class="empty"><i class="fas fa-file-alt"></i> 今日晨报尚未生成，点击"重新生成"创建</div>
    {% endif %}
  </div>
</div>
<script>window.MORNING_REPORT_CONTENT={{ content|tojson if content else 'null' }};</script>
{% endblock %}
