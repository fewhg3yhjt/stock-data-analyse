{% extends "base.html" %}{% block title %}StockInvestmentTool - 运行诊断{% endblock %}{% block body %}<main class="app"><header class="header"><div><h1><i class="fas fa-stethoscope"></i> 运行诊断</h1><div class="sub">应用、调度、数据、通知与安全开关的当前状态</div></div>{% set active='system' %}{% include '_nav.html' %}</header><section class="card"><div class="card-title">诊断摘要 <button class="btn btn-outline btn-sm" onclick="load()">重新检查</button></div><div id="summary" class="empty">加载中...</div></section><section class="card"><div class="table-wrap"><table><thead><tr><th>类别</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function load(){const d=await (await fetch('/api/health/details')).json();if(d.status!=='success'){document.getElementById('summary').textContent=d.error;return;}const f=d.features||{},o=d.notifications?.outbox||{},j=d.jobs?.recent||[];const rows=[['调度器',d.scheduler?.enabled?'正常':'未启用',`已注册 ${d.scheduler?.jobs||0} 个任务`],['日线同步',f.daily_sync?'已启用':'未启用','未启用时日线不会自动更新'],['分钟采集',f.minute_snapshot?'已启用':'未启用','分钟优先，服务观察池盘中行情'],['在线快照',f.online_snapshot?'已启用':'未启用','仅在分钟未启用时作为低频兜底'],['普通盘中提醒上限',f.intraday_notify_limit+' 次/日','紧急清仓通知不受此限制'],['通知 outbox',`pending ${o.pending||0} / dead ${o.dead||0}`,'查看通知中心处理失败投递'],['登录校验',f.auth_disabled?'已关闭':'已启用',f.auth_disabled?'当前所有页面和写接口均无需登录':''],['最近任务',j[0]?j[0].status:'暂无',''+(j[0]?.job_name||'暂无任务记录')]];document.getElementById('summary').innerHTML=f.auth_disabled?'<div class="error">当前生产登录校验已关闭。</div>':'<div class="notice">生产登录校验正常启用。</div>';document.getElementById('rows').innerHTML=rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('');}load();</script>{% endblock %}
