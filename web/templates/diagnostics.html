{% extends "base.html" %}
{% block title %}StockInvestmentTool - 运行诊断{% endblock %}
{% block head %}<script src="/static/ui-status.js?v=2"></script>{% endblock %}
{% block body %}
<main class="app">
  <header class="header"><div><h1><i class="fas fa-stethoscope"></i> 运行诊断</h1><div class="sub">应用、调度、数据、通知与安全开关的当前状态</div></div>{% set active='system' %}{% include '_nav.html' %}</header>
  <div class="notice"><strong>运行诊断</strong> 这里只读展示系统状态，异常项请进入数据中心、任务中心或通知中心处理。</div>
  <section class="card"><div class="card-title">诊断摘要 <button class="btn btn-outline btn-sm" onclick="load()">重新检查</button></div><div id="summary" class="empty">加载中...</div></section>
  <section class="card"><div class="table-wrap"><table><thead><tr><th>类别</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function load(){const d=await (await fetch('/api/health/details')).json();if(d.status!=='success'){document.getElementById('summary').textContent=d.error;return;}const f=d.features||{},o=d.notifications?.outbox||{},j=d.jobs?.recent||[];const statusText=new Proxy({}, {get:(_,key)=>window.UI_STATUS_LABEL?.(key,'run')||key||'状态未知'});const jobText={daily_sync:'日线数据同步',daily_tasks:'每日业务任务',rebuild_indicators:'技术指标更新',minute_snapshot:'分钟行情采集',online_snapshot:'在线行情快照',notification_outbox:'通知队列'};const rows=[['调度器',d.scheduler?.enabled?'运行中':'未运行',`已接入自动调度 ${d.scheduler?.jobs||0} 项`],['日线自动同步',f.daily_sync?'已开启':'未开启','未开启时日线不会自动更新'],['分钟行情采集',f.minute_snapshot?'已开启':'未开启','优先服务观察池盘中行情'],['在线行情快照',f.online_snapshot?'已开启':'未开启','仅在分钟行情未开启时作为兜底'],['普通盘中提醒上限',(f.intraday_notify_limit||0)+' 次/日','紧急清仓通知不受此限制'],['通知队列','待投递 '+(o.pending||0)+' / 多次投递失败 '+(o.dead||0),'前往通知中心处理失败投递'],['登录校验',f.auth_disabled?'已关闭':'已启用',f.auth_disabled?'当前页面和写入接口无需登录':''],['最近任务',j[0]?statusText[j[0].status]||'状态未知':'暂无',j[0]?jobText[j[0].job_name]||j[0].job_name:'暂无任务记录']];document.getElementById('summary').innerHTML=f.auth_disabled?'<div class="error">当前生产登录校验已关闭。</div>':'<div class="notice">生产登录校验正常启用。</div>';document.getElementById('rows').innerHTML=rows.map(r=>'<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td></tr>').join('');}load();
</script>
{% endblock %}
