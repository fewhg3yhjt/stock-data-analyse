{% extends "base.html" %}
{% block title %}StockInvestmentTool - 新建持仓{% endblock %}
{% block head %}
<style>
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0;}

body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--color-surface-subtle);color:var(--color-text);line-height:1.8;font-size:16px;}
.app{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
.header{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e0e4ea;display:flex;justify-content:space-between;align-items:flex-end;}
.header h1{font-size:22px;font-weight:700;}
.header a{color:var(--color-info);text-decoration:none;font-size:14px;}
.card{background:var(--color-surface);border:1px solid #e0e4ea;border-radius:var(--radius);padding:22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.ui-card-header{font-size:16px;font-weight:600;margin-bottom:16px;}
.ui-field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.ui-field label{font-size:13px;color:var(--color-text-subtle);font-weight:500;}
.ui-field input,.ui-field select{background:var(--color-surface-subtle);border:1px solid #e0e4ea;border-radius:6px;padding:10px 14px;color:var(--color-text);font-size:15px;outline:none;}
.ui-field input:focus{border-color:var(--color-info);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn{padding:11px 32px;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--color-info);color:#fff;width:100%;justify-content:center;}
.btn-primary:hover{background:var(--color-info);}
.hint{font-size:12px;color:var(--color-text-subtle);}
.autocomplete-field{position:relative;}.autocomplete-menu{position:absolute;left:0;right:0;top:100%;z-index:20;display:none;max-height:260px;overflow:auto;background:var(--color-surface);border:1px solid var(--color-border);border-radius:6px;box-shadow:0 8px 20px rgba(0,0,0,.14);}.autocomplete-option{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-bottom:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);text-align:left;cursor:pointer;font-size:13px;}.autocomplete-option:last-child{border-bottom:0;}.autocomplete-option:hover,.autocomplete-option.active{background:var(--color-surface-subtle);}.autocomplete-option small{color:var(--color-text-subtle);white-space:nowrap;}
.toast{position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;z-index:2000;display:none;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
</style>
{% endblock %}
{% block body %}
<div class="app">
  <div class="header">
    <h1><i class="fas fa-plus-circle"></i> 新建持仓</h1>
      <a href="/dashboard/warroom"><i class="fas fa-arrow-left"></i> 返回持仓</a>
  </div>
  <div class="ui-card">
    <div class="ui-card-header">录入已买入的持仓</div>
    <form id="add-form" autocomplete="off">
      <div class="form-row">
        <div class="ui-field autocomplete-field"><label>股票代码 *</label><input name="code" id="add-code" value="{{ prefill.code }}" placeholder="输入代码或名称关键词" required autocomplete="off">
          <div id="code-suggestions" class="autocomplete-menu"></div>
          <span class="hint" id="classify-hint">6xx/9xx 沪市 · 0xx/2xx/3xx 深市 · 输入代码后自动识别类型</span></div>
        <div class="ui-field autocomplete-field"><label>股票名称 *</label><input name="name" id="add-name" value="{{ prefill.name }}" placeholder="输入名称或代码关键词" autocomplete="off" required>
          <div id="name-suggestions" class="autocomplete-menu"></div><span class="hint" id="name-hint">输入名称或代码后，从下方候选中选择，系统会自动绑定股票代码</span></div>
      </div>
      <div class="form-row">
        <div class="ui-field"><label>持有份额 *</label><input name="shares" type="number" min="0" step="100" required></div>
        <div class="ui-field"><label>买入均价 *</label><input name="cost" type="number" min="0" step="any" required></div>
      </div>
      <div class="form-row">
        <div class="ui-field"><label>买入日期</label><input name="buy_date" type="date" onchange="fillPriceByDate()"></div>
        <div class="ui-field"><label>类型</label>
          <select name="stock_type" id="add-stock-type">
            <option value="B" {% if prefill.stock_type=='B' %}selected{% endif %}>B 价值白马</option>
            <option value="A" {% if prefill.stock_type=='A' %}selected{% endif %}>A 高成长</option>
            <option value="C" {% if prefill.stock_type=='C' %}selected{% endif %}>C 强周期</option>
            <option value="D" {% if prefill.stock_type=='D' %}selected{% endif %}>D 深度价值</option>
            <option value="E" {% if prefill.stock_type=='E' %}selected{% endif %}>E 场内ETF/基金</option>
          </select>
          <span class="hint">支持场内 ETF/LOF（5xx/15x 代码），自动识别类型</span></div>
      </div>
      <div class="ui-field"><label>策略方案</label>
        <select name="scheme">
          {% for s in schemes %}
          <option value="{{ s.name }}">{{ s.name }} — {{ s.description }}</option>
          {% endfor %}
        </select></div>
      <div class="ui-field"><label>备注</label><input name="notes" placeholder="可选"></div>
      <button type="submit" class="ui-button ui-button-primary"><i class="fas fa-check"></i> 确认建仓</button>
    </form>
  </div>
</div>
<script>
async function lookupName(){
  const code = document.getElementById('add-code').value.trim();
  const nameInput = document.querySelector('input[name="name"]');
  const costInput = document.querySelector('input[name="cost"]');
  if (!code) return;
  if (!nameInput.value.trim()){
    try {
      const r = await fetch('/api/stock/lookup?code=' + encodeURIComponent(code));
      const d = await r.json();
      if (d.status === 'success' && d.name && d.name !== code) nameInput.value = d.name;
    } catch(e){ /* 静默 */ }
  }
}
async function fillPriceByDate(){
  const code = document.getElementById('add-code').value.trim();
  const date = document.querySelector('input[name="buy_date"]').value;
  const costInput = document.querySelector('input[name="cost"]');
  if (!code || !date) return;
  // 仅在买入均价为空时自动填充（避免覆盖手动输入）
  if (costInput.value && parseFloat(costInput.value) > 0) return;
  try {
    const r = await fetch('/api/stock/lookup?code=' + encodeURIComponent(code) + '&date=' + encodeURIComponent(date));
    const d = await r.json();
    if (d.status === 'success' && d.price_at_date) costInput.value = d.price_at_date;
  } catch(e){ /* 静默 */ }
}
async function classifyStock(){
  const code = document.getElementById('add-code').value.trim();
  const hint = document.getElementById('classify-hint');
  if (!code){ hint.textContent = ''; return; }
  try {
    const r = await fetch('/api/classify?code=' + encodeURIComponent(code));
    const d = await r.json();
    if (d.status === 'success'){
      const sel = document.getElementById('add-stock-type');
      for (const o of sel.options){ if (o.value === d.stock_type){ sel.value = d.stock_type; break; } }
      hint.textContent = '自动识别: ' + (d.industry || '未知行业') + ' → 类型' + d.stock_type + '（可手动修改）';
    } else hint.textContent = '识别失败: ' + (d.error || '');
  } catch(e){ hint.textContent = '识别失败'; }
}
document.getElementById('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  const originalText = btn.innerHTML;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在保存持仓...';
  if (!fd.get('buy_date')) fd.set('buy_date', new Date().toISOString().slice(0,10));
  try {
    const res = await fetch('/portfolio/add', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.status === 'success') {
      showUiMessage('建仓成功 #' + data.position_id, 'success');
      setTimeout(() => location.href = '/portfolio/' + data.position_id, 600);
    } else {
      showUiMessage(data.error || '建仓失败', 'error');
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  } catch (err) {
    showUiMessage('建仓请求失败：' + (err.message || '网络异常'), 'error');
    btn.disabled = false;
    btn.innerHTML = originalText;
  }
});
async function classifySelectedStock(){
  const code=document.getElementById('add-code').value.trim();
  const hint=document.getElementById('classify-hint');
  if(!code) return;
  try{
    const response=await fetch('/api/classify?code='+encodeURIComponent(code));
    const data=await response.json();
    if(data.status==='success'){
      document.getElementById('add-stock-type').value=data.stock_type;
      const labels={A:'高成长',B:'价值白马',C:'强周期',D:'深度价值',E:'场内 ETF/基金'};
      hint.textContent='自动分类：'+data.stock_type+' '+(labels[data.stock_type]||'')+' · 行业：'+(data.industry||'未知')+' · ROE：'+(data.roe??'—')+'% · 营收增速：'+(data.rev_growth??'—')+'%（可手动覆盖）';
    }else hint.textContent='分类失败：'+(data.error||'请手动选择类型');
  }catch(error){ hint.textContent='分类失败，请手动选择类型'; }
}
function applyStockItem(item){
  document.getElementById('add-code').value=item.code || '';
  document.getElementById('add-name').value=item.name || item.code || '';
  document.getElementById('classify-hint').textContent='已绑定: '+item.code+'（'+(item.asset_type==='etf'?'场内 ETF':'股票')+'）';
  document.getElementById('name-hint').textContent='已选择 '+(item.name || item.code);
  document.querySelectorAll('.autocomplete-menu').forEach(menu=>{menu.style.display='none';});
  classifySelectedStock();
  fillPriceByDate();
}
function bindStockAutocomplete(inputId, menuId){
  const input=document.getElementById(inputId), menu=document.getElementById(menuId); let timer, controller;
  function close(){menu.style.display='none';menu.replaceChildren();}
  input.addEventListener('input', function(){
    const query=this.value.trim(); clearTimeout(timer); if(controller) controller.abort();
    if(query.length<1){close();return;}
    timer=setTimeout(async ()=>{
      try{
        controller=new AbortController();
        const response=await fetch('/api/stock/search?q='+encodeURIComponent(query),{signal:controller.signal});
        const data=await response.json(); const items=data.items||[];
        menu.replaceChildren();
        if(!items.length){close();return;}
        items.forEach(item=>{
          const button=document.createElement('button'); button.type='button'; button.className='autocomplete-option';
          button.innerHTML='<span><b></b><br><small></small></span><small></small>';
          button.querySelector('b').textContent=item.name || item.code;
          button.querySelector('span small').textContent=item.code;
          button.querySelector(':scope > small').textContent=item.asset_type==='etf'?'ETF':'股票';
          button.addEventListener('mousedown',event=>{event.preventDefault();applyStockItem(item);});
          menu.appendChild(button);
        });
        menu.style.display='block';
      }catch(error){if(error.name!=='AbortError') close();}
    },180);
  });
  input.addEventListener('blur',()=>setTimeout(close,180));
  input.addEventListener('keydown',event=>{
    const options=[...menu.querySelectorAll('.autocomplete-option')]; if(!options.length)return;
    let index=options.findIndex(o=>o.classList.contains('active'));
    if(event.key==='ArrowDown'){event.preventDefault();index=(index+1)%options.length;}
    else if(event.key==='ArrowUp'){event.preventDefault();index=(index-1+options.length)%options.length;}
    else if(event.key==='Enter' && index>=0){event.preventDefault();options[index].dispatchEvent(new MouseEvent('mousedown'));return;}
    else if(event.key==='Escape'){close();return;}
    else return;
    options.forEach((option,i)=>option.classList.toggle('active',i===index));
  });
}
bindStockAutocomplete('add-name','name-suggestions');
bindStockAutocomplete('add-code','code-suggestions');
document.getElementById('add-code').addEventListener('blur', classifySelectedStock);
document.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('add-code').value) classifyStock();
});
</script>
{% endblock %}
