{% extends "base.html" %}
{% block title %}StockInvestmentTool - 新建持仓{% endblock %}
{% block head %}
<style>
*, *::before, *::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#f5f6f8;--surface:#fff;--surface2:#f8f9fb;--border:#e0e4ea;--text:#1a1a2e;--text2:#6b7280;--accent:#1a73e8;--accent2:#1557b0;--radius:8px;}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.8;font-size:16px;}
.app{max-width:640px;margin:0 auto;padding:32px 20px 60px;}
.header{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #e0e4ea;display:flex;justify-content:space-between;align-items:flex-end;}
.header h1{font-size:22px;font-weight:700;}
.header a{color:var(--accent);text-decoration:none;font-size:14px;}
.card{background:var(--surface);border:1px solid #e0e4ea;border-radius:var(--radius);padding:22px 26px;box-shadow:0 1px 3px rgba(0,0,0,.07);}
.card-title{font-size:16px;font-weight:600;margin-bottom:16px;}
.form-group{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.form-group label{font-size:13px;color:var(--text2);font-weight:500;}
.form-group input,.form-group select{background:var(--surface2);border:1px solid #e0e4ea;border-radius:6px;padding:10px 14px;color:var(--text);font-size:15px;outline:none;}
.form-group input:focus{border-color:var(--accent);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.btn{padding:11px 32px;border:none;border-radius:6px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:8px;}
.btn-primary{background:var(--accent);color:#fff;width:100%;justify-content:center;}
.btn-primary:hover{background:var(--accent2);}
.hint{font-size:12px;color:var(--text2);}
.toast{position:fixed;bottom:24px;right:24px;background:#323232;color:#fff;padding:12px 20px;border-radius:6px;font-size:14px;z-index:2000;display:none;}
@media(max-width:600px){.form-row{grid-template-columns:1fr;}}
</style>
{% endblock %}
{% block body %}
<div class="app">
  <div class="header">
    <h1><i class="fas fa-plus-circle"></i> 新建持仓</h1>
    <a href="/dashboard/warroom"><i class="fas fa-arrow-left"></i> 返回仪表盘</a>
  </div>
  <div class="card">
    <div class="card-title">录入已买入的持仓</div>
    <form id="add-form" autocomplete="off">
      <div class="form-row">
        <div class="form-group"><label>股票代码 *</label><input name="code" id="add-code" value="{{ prefill.code }}" placeholder="sh.600900" required onblur="classifyStock();lookupName()">
          <span class="hint" id="classify-hint">6xx/9xx 沪市 · 0xx/2xx/3xx 深市 · 输入代码后自动识别类型</span></div>
        <div class="form-group"><label>股票名称 *</label><input name="name" value="{{ prefill.name }}" placeholder="长江电力" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>持有份额 *</label><input name="shares" type="number" min="0" step="100" required></div>
        <div class="form-group"><label>买入均价 *</label><input name="cost" type="number" min="0" step="any" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>买入日期</label><input name="buy_date" type="date" onchange="fillPriceByDate()"></div>
        <div class="form-group"><label>类型</label>
          <select name="stock_type" id="add-stock-type">
            <option value="B" {% if prefill.stock_type=='B' %}selected{% endif %}>B 价值白马</option>
            <option value="A" {% if prefill.stock_type=='A' %}selected{% endif %}>A 高成长</option>
            <option value="C" {% if prefill.stock_type=='C' %}selected{% endif %}>C 强周期</option>
            <option value="D" {% if prefill.stock_type=='D' %}selected{% endif %}>D 深度价值</option>
            <option value="E" {% if prefill.stock_type=='E' %}selected{% endif %}>E 场内ETF/基金</option>
          </select>
          <span class="hint">支持场内 ETF/LOF（5xx/15x 代码），自动识别类型</span></div>
      </div>
      <div class="form-group"><label>策略方案</label>
        <select name="scheme">
          {% for s in schemes %}
          <option value="{{ s.name }}">{{ s.name }} — {{ s.description }}</option>
          {% endfor %}
        </select></div>
      <div class="form-group"><label>备注</label><input name="notes" placeholder="可选"></div>
      <button type="submit" class="btn btn-primary"><i class="fas fa-check"></i> 确认建仓</button>
    </form>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
async function lookupName(){
  const code = document.getElementById('add-code').value.trim();
  const nameInput = document.querySelector('input[name="name"]');
  const costInput = document.querySelector('input[name="cost"]');
  if (!code) return;
  if (!nameInput.value.trim()){
    try {
      const r = await fetch('/api/stock/lookup?code=' + encodeURIComponent(code));
      const d = await r.json();
      if (d.status === 'success' && d.name && d.name !== code) nameInput.value = d.name;
    } catch(e){ /* 静默 */ }
  }
}
async function fillPriceByDate(){
  const code = document.getElementById('add-code').value.trim();
  const date = document.querySelector('input[name="buy_date"]').value;
  const costInput = document.querySelector('input[name="cost"]');
  if (!code || !date) return;
  // 仅在买入均价为空时自动填充（避免覆盖手动输入）
  if (costInput.value && parseFloat(costInput.value) > 0) return;
  try {
    const r = await fetch('/api/stock/lookup?code=' + encodeURIComponent(code) + '&date=' + encodeURIComponent(date));
    const d = await r.json();
    if (d.status === 'success' && d.price_at_date) costInput.value = d.price_at_date;
  } catch(e){ /* 静默 */ }
}
async function classifyStock(){
  const code = document.getElementById('add-code').value.trim();
  const hint = document.getElementById('classify-hint');
  if (!code){ hint.textContent = ''; return; }
  try {
    const r = await fetch('/api/classify?code=' + encodeURIComponent(code));
    const d = await r.json();
    if (d.status === 'success'){
      const sel = document.getElementById('add-stock-type');
      for (const o of sel.options){ if (o.value === d.stock_type){ sel.value = d.stock_type; break; } }
      hint.textContent = '自动识别: ' + (d.industry || '未知行业') + ' → 类型' + d.stock_type + '（可手动修改）';
    } else hint.textContent = '识别失败: ' + (d.error || '');
  } catch(e){ hint.textContent = '识别失败'; }
}
document.getElementById('add-form').addEventListener('submit', async e => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const btn = e.target.querySelector('button');
  btn.disabled = true;
  if (!fd.get('buy_date')) fd.set('buy_date', new Date().toISOString().slice(0,10));
  const res = await fetch('/portfolio/add', { method: 'POST', body: fd });
  const data = await res.json();
  if (data.status === 'success') {
    showToast('建仓成功 #' + data.position_id);
    setTimeout(() => location.href = '/portfolio/' + data.position_id, 600);
  } else {
    showToast(data.error || '建仓失败');
    btn.disabled = false;
  }
});
document.addEventListener('DOMContentLoaded', () => {
  if (document.getElementById('add-code').value) classifyStock();
});
function showToast(msg) {
  const t = document.getElementById('toast');
  t.style.display = 'block'; t.textContent = msg;
  setTimeout(() => t.style.display = 'none', 3000);
}
</script>
{% endblock %}
