{% extends "base.html" %}
{% block title %}StockInvestmentTool - 操作点位{% endblock %}
{% block head %}<style>.op-layout{display:grid;grid-template-columns:320px 1fr;gap:16px}.op-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.op-metric{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px}.op-metric small{color:var(--text2);display:block}.op-metric b{font-size:16px}.state-ok{color:var(--green)}.state-wait{color:var(--orange)}.state-no{color:var(--red)}.op-status{min-height:24px;font-size:13px}.op-chart{height:360px}@media(max-width:850px){.op-layout{grid-template-columns:1fr}.op-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>{% endblock %}
{% block body %}<main class="app"><header class="header"><div><h1><i class="fas fa-crosshairs"></i> 个股操作点位</h1><div class="sub">状态 → 价格位置 → 买入观察 → 止损目标 → 盈亏比</div></div>{% set active='research' %}{% include '_nav.html' %}</header><div class="op-layout"><section class="card"><div class="card-title">策略参数</div><div class="form-group"><label>股票代码</label><input id="code" value="sh.600900" placeholder="sh600900"></div><div class="form-group"><label>策略版本名称</label><input id="name" value="operation_points_default"></div><div class="form-group"><label>区间周期</label><input id="lookback_days" type="number" value="20"></div><div class="form-group"><label>MA20 斜率阈值（%）</label><input id="ma_slope_threshold" type="number" step="0.1" value="2"></div><div class="form-group"><label>中枢漂移阈值（%）</label><input id="center_shift_threshold" type="number" step="0.1" value="3"></div><div class="form-group"><label>低位阈值（%）</label><input id="low_position_threshold" type="number" step="1" value="25"></div><div class="form-group"><label>止损 ATR 倍数</label><input id="stop_atr_k" type="number" step="0.1" value="0.3"></div><div class="form-group"><label>最低盈亏比</label><input id="min_rr" type="number" step="0.1" value="2"></div><button id="analyze-btn" class="btn btn-primary" onclick="analyze()">分析当前点位</button> <button id="backtest-btn" class="btn btn-outline" onclick="backtest()">运行回测</button><div id="status" class="op-status"></div></section><section><div class="card"><div class="card-title"><span id="headline">分析结果</span><span id="asof" class="note"></span></div><div id="summary" class="empty">输入代码后点击“分析当前点位”</div></div><div class="card"><div class="card-title">日线确认</div><div id="chart" class="op-chart"><div class="empty">暂无数据</div></div></div></section></div></main><script>
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function num(id){return Number(document.getElementById(id).value);}function payload(){return {name:document.getElementById('name').value,version:'1.0',lookback_days:num('lookback_days'),ma_slope_threshold:num('ma_slope_threshold')/100,center_shift_threshold:num('center_shift_threshold')/100,low_position_threshold:num('low_position_threshold')/100,stop_atr_k:num('stop_atr_k'),min_rr:num('min_rr')};}function setStatus(t,c=''){const e=document.getElementById('status');e.textContent=t;e.className='op-status '+c;}
async function analyze(){const b=document.getElementById('analyze-btn');b.disabled=true;setStatus('正在读取本地日线并计算…');try{const r=await fetch('/api/operation-points/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,config:payload()})});const d=await r.json();if(!r.ok||d.status!=='success')throw Error(d.error||'分析失败');render(d.result);renderChart(d.series);setStatus('分析完成（参数未保存为版本）','state-ok');}catch(e){setStatus('分析失败：'+e.message,'state-no');}finally{b.disabled=false;}}
function render(r){document.getElementById('headline').textContent=(r.strategy.name||'策略')+' · '+(r.state_reasons||[]).join('、');document.getElementById('asof').textContent='数据截至 '+(r.calculation_as_of||'暂无');const cls=r.operation==='BUY_SIGNAL'?'state-ok':r.operation==='NO_BUY'?'state-no':'state-wait';document.getElementById('summary').innerHTML=`<div class="notice ${cls}"><b>${esc(r.operation)}</b>：${esc(r.operation_reason)}<br>${esc(r.execution)}</div><div class="op-grid"><div class="op-metric"><small>行情状态</small><b>${esc(r.state)}</b></div><div class="op-metric"><small>当前价格</small><b>${r.current_price??'—'}</b></div><div class="op-metric"><small>20日位置</small><b>${r.position20==null?'—':(r.position20*100).toFixed(1)+'%'}</b><br><small>${esc(r.position_label)}</small></div><div class="op-metric"><small>H20 / L20</small><b>${r.h20??'—'} / ${r.l20??'—'}</b></div><div class="op-metric"><small>MA20 / MA60</small><b>${r.ma20??'—'} / ${r.ma60??'—'}</b></div><div class="op-metric"><small>ATR14</small><b>${r.atr14??'—'}</b></div><div class="op-metric"><small>计划买入价</small><b>${r.plan_buy_price??'—'}</b></div><div class="op-metric"><small>结构止损</small><b>${r.stop_price??'—'}</b></div><div class="op-metric"><small>Target1 / Target2</small><b>${r.target1??'—'} / ${r.target2??'—'}</b></div><div class="op-metric"><small>风险 / Target1收益</small><b>${r.risk??'—'} / ${r.reward1??'—'}</b></div><div class="op-metric"><small>RR1</small><b>${r.rr1==null?'—':r.rr1.toFixed(2)}</b></div><div class="op-metric"><small>MA20穿越次数</small><b>${r.ma20_cross_count}</b></div></div>`;}
function renderChart(s){if(!window.echarts||!s||!s.dates.length)return;const c=echarts.init(document.getElementById('chart'));c.setOption({tooltip:{trigger:'axis'},legend:{data:['收盘','最高','最低']},xAxis:{type:'category',data:s.dates},yAxis:{type:'value',scale:true},dataZoom:[{type:'inside'},{type:'slider'}],series:[{name:'收盘',type:'line',data:s.close,showSymbol:false},{name:'最高',type:'line',data:s.high,showSymbol:false},{name:'最低',type:'line',data:s.low,showSymbol:false}]});}
async function backtest(){const b=document.getElementById('backtest-btn');b.disabled=true;setStatus('正在运行日线回测…');try{const r=await fetch('/api/operation-points/backtest',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:document.getElementById('code').value,config:payload()})});const d=await r.json();if(!r.ok||d.status!=='success')throw Error(d.error||'回测失败');const x=d.result,diag=x.diagnostics||{};document.getElementById('summary').innerHTML=`<div class="notice state-ok">回测完成：${x.trade_count} 笔交易，胜率 ${x.win_rate}%<br><small>数据区间 ${esc(x.data_start||'—')} ~ ${esc(x.data_end||'—')} · 有效判断区间 ${esc(x.effective_start||'—')} ~ ${esc(x.effective_end||'—')}</small></div><div class="op-grid"><div class="op-metric"><small>平均盈利</small><b>${x.average_profit}%</b></div><div class="op-metric"><small>平均亏损</small><b>${x.average_loss}%</b></div><div class="op-metric"><small>Profit Factor</small><b>${x.profit_factor??'—'}</b></div><div class="op-metric"><small>有效交易日</small><b>${diag.eligible_days||0}</b></div><div class="op-metric"><small>低位观察日</small><b>${diag.watch_days||0}</b></div><div class="op-metric"><small>止跌确认日</small><b>${diag.stop_confirmed_days||0}</b></div><div class="op-metric"><small>RR达标日</small><b>${diag.rr_pass_days||0}</b></div></div>`;setStatus('回测完成','state-ok');}catch(e){setStatus('回测失败：'+e.message,'state-no');}finally{b.disabled=false;}}
</script>{% endblock %}
