{% extends "base.html" %}
{% block title %}StockInvestmentTool - 操作点位{% endblock %}
{% block head %}
<script src="{{ static_asset('echarts.min.js') }}"></script>
<script src="{{ static_asset('stock-chart.js') }}"></script>
<script src="{{ static_asset('operation-points.js') }}" defer></script>
<link rel="stylesheet" href="{{ static_asset('operation-points.css') }}">
{% endblock %}
{% block body %}
<main class="app">
  <header class="header">
    <div>
      <h1><i class="fas fa-crosshairs"></i> 个股操作点位</h1>
      <div class="sub">状态 → 价格位置 → 买入观察 → 止损目标 → 盈亏比</div>
    </div>
    {% set active='research' %}{% include '_nav.html' %}
  </header>
  <div class="op-layout">
    <section class="ui-card">
      <div class="ui-card-header">策略参数</div>
      <div class="ui-field"><label for="code">股票代码</label><input id="code" value="sh.600900" placeholder="sh600900"></div>
      <div class="ui-field"><label for="name">策略版本名称</label><input id="name" value="operation_points_default"></div>
      <div class="ui-field"><label for="lookback_days">区间周期</label><input id="lookback_days" type="number" value="20"></div>
      <div class="ui-field"><label for="ma_slope_threshold">MA20 斜率阈值（%）</label><input id="ma_slope_threshold" type="number" step="0.1" value="2"></div>
      <div class="ui-field"><label for="center_shift_threshold">中枢漂移阈值（%）</label><input id="center_shift_threshold" type="number" step="0.1" value="3"></div>
      <div class="ui-field"><label for="low_position_threshold">低位阈值（%）</label><input id="low_position_threshold" type="number" step="1" value="25"></div>
      <div class="ui-field"><label for="stop_atr_k">止损 ATR 倍数</label><input id="stop_atr_k" type="number" step="0.1" value="0.3"></div>
      <div class="ui-field"><label for="min_rr">最低盈亏比</label><input id="min_rr" type="number" step="0.1" value="2"></div>
      <button id="analyze-btn" class="ui-button ui-button-primary" onclick="analyze()">分析当前点位</button>
      <button id="backtest-btn" class="ui-button ui-button-secondary" onclick="backtest()">运行回测</button>
      <div id="status" class="op-status" role="status"></div>
    </section>
    <section>
      <div class="ui-card">
        <div class="ui-card-header"><span id="headline">分析结果</span><span id="asof" class="note"></span></div>
        <div id="summary" class="empty">输入代码后点击“分析当前点位”</div>
      </div>
      <div class="ui-card">
        <div class="ui-card-header">日线确认</div>
        <div id="chart" class="op-chart"><div class="empty">暂无数据</div></div>
      </div>
    </section>
  </div>
</main>
{% endblock %}
