{% extends "base.html" %}
{% block title %}数据资产{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/data-module.css?v=4">{% endblock %}
{% block body %}
<div class="dm-page"><aside class="dm-sidebar"><div class="dm-brand"><div class="dm-brand-mark"><i class="fas fa-chart-line"></i></div><div><strong>量化星球</strong><span>数据智能平台</span></div></div><div class="dm-side-label">工作台</div><nav class="dm-side-nav"><a href="/workbench"><i class="fas fa-border-all"></i>工作台</a><a href="/market"><i class="fas fa-compass"></i>市场发现</a><a href="/analyze"><i class="fas fa-chart-column"></i>个股分析</a><a href="/watch-pool"><i class="far fa-star"></i>观察池</a><a class="active" href="/data-center"><i class="fas fa-database"></i>数据中心</a><a href="/data-center/tasks"><i class="fas fa-list-check"></i>任务中心</a></nav><div class="dm-side-bottom"><div class="dm-user"><span class="dm-avatar"><i class="fas fa-user"></i></span><span>量化研究员</span></div><div class="dm-side-actions"><i class="fas fa-bell"></i><i class="fas fa-gear"></i><i class="fas fa-right-from-bracket"></i></div></div></aside><main class="dm-main"><header class="dm-top"><div class="dm-title"><h1>数据资产</h1><p>查看实际数据和指标的定义、最新日期、覆盖情况与健康状态</p></div><div class="dm-top-actions"><span class="dm-refresh">最近刷新 <b id="asset-refresh">--:--</b> <i class="fas fa-rotate"></i></span><button class="dm-btn" onclick="loadAssets()">刷新</button></div></header><nav class="dm-tabs"><a href="/data-center">数据总览</a><a class="active" href="/data-center/assets">数据资产</a><a href="/data-center/tasks">任务中心</a></nav><section class="dm-kpis" id="asset-kpis"></section><section class="dm-card"><div class="dm-card-head"><h2>数据项目录</h2><div class="dm-toolbar"><select class="dm-select" id="asset-category" onchange="loadAssets()"><option value="">全部分类</option><option>基础行情</option><option>估值数据</option><option>基本面数据</option><option>技术指标</option><option>资金流指标</option><option>研究因子</option><option>业务指标</option><option>数据集</option></select><input class="dm-input" id="asset-filter" placeholder="搜索名称、代码或定义" oninput="renderAssets()"></div></div><div class="dm-table-wrap"><table class="dm-table"><thead><tr><th>名称</th><th>分类</th><th>最新实际日期</th><th>覆盖</th><th>健康状态</th><th>关联任务</th></tr></thead><tbody id="asset-list"><tr><td colspan="6" class="dm-empty">读取中...</td></tr></tbody></table></div></section></main></div><div class="dm-drawer-mask" id="asset-mask" onclick="if(event.target===this)closeAsset()"><aside class="dm-drawer"><header class="dm-drawer-head"><div><h2 id="drawer-title">数据项详情</h2><div class="dm-muted" id="drawer-sub"></div></div><button class="dm-btn" onclick="closeAsset()">关闭</button></header><div id="asset-detail" class="dm-detail-empty">选择数据项查看详情</div></aside></div><script>
let assets=[];const names={healthy:'正常',partial:'部分可用',stale:'待更新',critical:'异常',unknown:'暂无状态'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function health(v){v=v||'unknown';return `<span class="dm-health ${esc(v)}">${esc(names[v]||v)}</span>`}function renderAssets(){const q=(document.getElementById('asset-filter').value||'').toLowerCase();const rows=assets.filter(x=>!q||`${x.display_name} ${x.asset_key} ${x.definition}`.toLowerCase().includes(q));document.getElementById('asset-list').innerHTML=rows.map(x=>{const c=x.coverage||{};return `<tr data-key="${esc(x.asset_key)}"><td><strong>${esc(x.display_name)}</strong><div class="dm-code">${esc(x.asset_key)}</div></td><td>${esc(x.category||'数据集')}</td><td>${esc(x.latest_actual_date||'暂无')}</td><td>${c.ratio==null?'暂无':`${c.covered||0} / ${c.expected||'—'}<div class="dm-cover-bar"><i style="width:${Math.min(100,c.ratio*100)}%"></i></div>`}</td><td>${health(x.health?.status)}</td><td class="dm-muted">${esc(x.producer_task||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="dm-empty">没有匹配的数据项</td></tr>';document.querySelectorAll('#asset-list tr[data-key]').forEach(r=>r.onclick=()=>openAsset(r.dataset.key))}async function loadAssets(){const category=document.getElementById('asset-category').value;const d=await (await fetch('/api/data-center/assets?'+(category?'category='+encodeURIComponent(category):''))).json();if(d.status!=='success')return;assets=d.assets||[];const total=assets.length,normal=assets.filter(x=>x.health?.status==='healthy').length,attention=assets.filter(x=>['partial','stale','critical'].includes(x.health?.status)).length;document.getElementById('asset-kpis').innerHTML=[['数据项总数',total,'数据集和指标定义'],['正常',normal,'健康状态正常'],['待关注',attention,'待更新或异常'],['已配置任务',new Set(assets.map(x=>x.producer_task).filter(Boolean)).size,'关联生产任务']].map(x=>`<div class="dm-kpi"><div class="dm-kpi-label">${x[0]}</div><div class="dm-kpi-value">${x[1]}</div><div class="dm-kpi-note">${x[2]}</div></div>`).join('');renderAssets();document.getElementById('asset-refresh').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}async function openAsset(key){const d=await (await fetch('/api/data-center/assets/'+encodeURIComponent(key))).json();if(d.status!=='success')return;const x=d.asset||{},c=x.coverage||{};document.getElementById('drawer-title').textContent=x.display_name||key;document.getElementById('drawer-sub').textContent=(x.category||'数据项')+' · '+key;document.getElementById('asset-detail').innerHTML=`<div class="dm-detail"><section class="dm-detail-section"><h3>定义与统一口径</h3><dl class="dm-kv"><dt>定义</dt><dd>${esc(x.definition||'暂无')}</dd><dt>单位</dt><dd>${esc(x.unit||'—')}</dd><dt>关联任务</dt><dd>${esc(x.producer_task||'—')}</dd></dl></section><section class="dm-detail-section"><h3>健康情况</h3><dl class="dm-kv"><dt>状态</dt><dd>${health(x.health?.status)}</dd><dt>最新实际日期</dt><dd>${esc(x.latest_actual_date||'暂无')}</dd><dt>覆盖</dt><dd>${c.ratio==null?'暂无':`${c.covered||0} / ${c.expected||'—'} (${(c.ratio*100).toFixed(1)}%)`}</dd><dt>说明</dt><dd>${esc(x.health?.message||'—')}</dd></dl></section><section class="dm-detail-section"><h3>证券类型适用性</h3><div class="dm-type-grid">${Object.entries(x.applicability||{}).map(([k,v])=>`<div class="dm-type ${v==='not_applicable'?'na':''}"><span>${esc(k==='stock'?'股票':k==='etf'?'ETF':'指数')}</span><b>${esc(v==='required'?'必须':v==='optional'?'可选':'不适用')}</b></div>`).join('')||'<div class="dm-muted">暂无类型信息</div>'}</div></section></div>`;document.getElementById('asset-mask').classList.add('open')}function closeAsset(){document.getElementById('asset-mask').classList.remove('open')}loadAssets();
</script><script src="/static/data-assets-admin.js?v=1"></script>{% endblock %}
