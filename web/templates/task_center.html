{% extends "base.html" %}
{% block title %}任务中心{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/data-module.css?v=4">{% endblock %}
{% block body %}
<div class="dm-page">
  <aside class="dm-sidebar"><div class="dm-brand"><div class="dm-brand-mark"><i class="fas fa-chart-line"></i></div><div><strong>量化星球</strong><span>数据智能平台</span></div></div><div class="dm-side-label">工作台</div><nav class="dm-side-nav"><a href="/workbench"><i class="fas fa-border-all"></i>工作台</a><a href="/market"><i class="fas fa-compass"></i>市场发现</a><a href="/analyze"><i class="fas fa-chart-column"></i>个股分析</a><a href="/watch-pool"><i class="far fa-star"></i>观察池</a><a class="active" href="/data-center"><i class="fas fa-database"></i>数据中心</a></nav><div class="dm-side-bottom"><div class="dm-user"><span class="dm-avatar"><i class="fas fa-user"></i></span><span>量化研究员</span></div><div class="dm-side-actions"><i class="fas fa-bell"></i><i class="fas fa-gear"></i><i class="fas fa-right-from-bracket"></i></div></div></aside>
  <main class="dm-main"><header class="dm-top"><div class="dm-title"><h1>任务中心</h1><p>管理任务配置、执行周期、运行进度和生成结果</p></div><div class="dm-top-actions"><span class="dm-refresh">最近刷新 <b id="task-refresh">--:--</b> <i class="fas fa-rotate"></i></span><button class="dm-btn" id="refresh-tasks">刷新</button><button class="dm-btn primary" id="new-task">+ 新建任务</button></div></header><nav class="dm-tabs"><a href="/data-center">数据总览</a><a href="/data-center/assets">数据资产</a><a class="active" href="/data-center/tasks">任务中心</a></nav><section class="dm-kpis" id="task-kpis"></section><section class="dm-card"><div class="dm-card-head"><h2>任务列表</h2><div class="dm-toolbar"><select class="dm-select" id="task-stage"><option value="">全部阶段</option><option value="CAPTURE">数据采集</option><option value="BUILD">数据构建</option><option value="QUALITY">数据质量</option><option value="PUBLISH">数据发布</option><option value="DERIVED">派生计算</option></select><select class="dm-select" id="task-status"><option value="">全部状态</option><option value="running">执行中</option><option value="success">已完成</option><option value="partial_success">部分完成</option><option value="failed">执行失败</option><option value="disabled">未启用</option></select><input class="dm-input" id="task-search" placeholder="搜索任务、代码或类型"></div></div><div class="dm-table-wrap"><div id="task-list"><div class="dm-empty">读取中...</div></div></div><div class="dm-note task-note">任务定义、默认执行周期和本次实际执行范围分开显示；任务配置只有显式生效后才会用于调度。</div></section></main>
</div>
<div class="dm-drawer-mask" id="task-mask"><aside class="dm-drawer"><header class="dm-drawer-head"><div><h2 id="task-drawer-title">任务详情</h2><div class="dm-muted" id="task-drawer-sub"></div></div><button class="dm-btn" id="close-task">关闭</button></header><div class="dm-drawer-body" id="task-drawer-body"></div></aside></div>
<script>
const stageNames={CAPTURE:'数据采集',BUILD:'数据构建',QUALITY:'数据质量',PUBLISH:'数据发布',DERIVED:'派生计算'};const typeNames={SOURCE_CAPTURE:'源数据采集',DATA_BUILD:'标准数据构建',QUALITY_CHECK:'数据质量检查',DATA_PUBLISH:'数据正式发布',INDICATOR_BUILD:'技术指标计算',FACTOR_BUILD:'研究因子计算',DERIVED_BUILD:'派生数据计算'};const statusNames={running:'执行中',success:'已完成',partial_success:'部分完成',failed:'执行失败',skipped:'已跳过',disabled:'未启用'};const state={tasks:[]};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function statusTag(value){const valueKey=value||'disabled';const cls=valueKey==='success'?'healthy':valueKey==='failed'?'critical':valueKey==='running'?'stale':valueKey==='partial_success'?'partial':'unknown';return `<span class="dm-health ${cls}">${esc(statusNames[valueKey]||valueKey)}</span>`;}
function taskStatus(task){return task.running_run?.status||task.latest_run?.status||(task.enabled?'scheduled':'disabled');}
function taskGroups(){const groups={};for(const task of state.tasks)(groups[task.stage]??=[]).push(task);return Object.entries(groups);}
function renderTasks(){const stage=document.getElementById('task-stage').value,status=document.getElementById('task-status').value,q=document.getElementById('task-search').value.trim().toLowerCase();const filtered=state.tasks.filter(task=>{const current=taskStatus(task);return(!stage||task.stage===stage)&&(!status||current===status)&&(!q||`${task.display_name} ${task.task_key} ${task.task_type_label}`.toLowerCase().includes(q));});document.getElementById('task-list').innerHTML=taskGroups().map(([group,items])=>{const visible=items.filter(item=>filtered.includes(item));if(!visible.length)return'';return `<section class="dm-task-group"><div class="dm-task-group-head">${esc(stageNames[group]||group)} <b>${visible.length}</b></div><table class="dm-task-table"><thead><tr><th>任务名称</th><th>任务类型</th><th>默认周期</th><th>本次执行范围</th><th>状态</th><th>进度</th><th>操作</th></tr></thead><tbody>${visible.map(task=>{const run=task.running_run||task.latest_run;const schedule=task.schedule||{};const range=run?.period_start&&run?.period_end?`${run.period_start} ~ ${run.period_end}`:'暂无执行记录';return `<tr data-task-key="${esc(task.task_key)}"><td><strong>${esc(task.display_name)}</strong><div class="dm-code">${esc(task.task_key)}</div></td><td>${esc(task.task_type_label||typeNames[task.task_type]||task.task_type)}</td><td>${esc(schedule.frequency||'手动')}<div class="dm-code">${schedule.time?esc(schedule.time):'依赖上游'} · ${schedule.enabled?'已启用':'未启用'}</div></td><td>${esc(range)}</td><td>${statusTag(taskStatus(task))}</td><td>${run?.progress==null?'—':`${run.progress}%`}</td><td><div class="dm-task-actions"><button class="dm-mini-btn detail-task">查看详情</button><button class="dm-mini-btn run-task">立即执行</button></div></td></tr>`}).join('')}</tbody></table></section>`}).join('')||'<div class="dm-empty">没有匹配的任务</div>';document.querySelectorAll('[data-task-key]').forEach(row=>{const key=row.dataset.taskKey;row.querySelector('.detail-task').onclick=()=>showTask(key);row.querySelector('.run-task').onclick=()=>runTask(key);});}
function showTask(key){const task=state.tasks.find(item=>item.task_key===key);if(!task)return;const run=task.running_run||task.latest_run;const cfg=task.config||{};document.getElementById('task-drawer-title').textContent=task.display_name;document.getElementById('task-drawer-sub').textContent=`${stageNames[task.stage]||task.stage} · ${typeNames[task.task_type]||task.task_type}`;document.getElementById('task-drawer-body').innerHTML=`<section class="dm-detail-section"><h3>执行概览</h3><dl class="dm-kv"><dt>任务代码</dt><dd>${esc(task.task_key)}</dd><dt>状态</dt><dd>${statusTag(taskStatus(task))}</dd><dt>配置版本</dt><dd>v${esc(task.active_config_version||'—')}</dd><dt>默认周期</dt><dd>${esc(task.schedule?.frequency||'手动')} ${esc(task.schedule?.time||'')}</dd><dt>本次范围</dt><dd>${run?.period_start&&run?.period_end?`${esc(run.period_start)} ~ ${esc(run.period_end)}`:'暂无执行记录'}</dd><dt>输入数据</dt><dd>${esc((cfg.task?.input_datasets||[]).join('、')||'—')}</dd><dt>输出数据</dt><dd>${esc((cfg.task?.output_datasets||[]).join('、')||'—')}</dd></dl></section><section class="dm-detail-section"><h3>运行进度</h3><dl class="dm-kv"><dt>运行记录</dt><dd>${run?.id?`#${run.id}`:'暂无'}</dd><dt>当前阶段</dt><dd>${esc(run?.phase||'—')}</dd><dt>进度</dt><dd>${run?.progress==null?'—':`${run.progress}% (${run.processed??'—'}/${run.total??'—'})`}</dd><dt>当前对象</dt><dd>${esc(run?.current_item||'—')}</dd><dt>最近结果</dt><dd>${esc(run?.error||'—')}</dd></dl></section><section class="dm-detail-section"><h3>相关操作</h3><div class="dm-toolbar"><button class="dm-btn" onclick="showTaskLog('${esc(run?.id||'')}')">查看日志</button><button class="dm-btn" onclick="showTaskArtifacts('${esc(run?.id||'')}')">查看产物</button><button class="dm-btn" onclick="alert('补数据将在执行请求表单中指定周期和范围')">补数据</button></div></section>`;document.getElementById('task-mask').classList.add('open');}
function showTaskLog(id){if(!id)return alert('当前任务还没有执行记录');fetch(`/api/tasks/runs/${id}/logs`).then(r=>r.json()).then(d=>alert(d.log||'暂无日志'));}function showTaskArtifacts(id){if(!id)return alert('当前任务还没有执行产物');fetch(`/api/tasks/runs/${id}/artifacts`).then(r=>r.json()).then(d=>alert((d.artifacts||[]).map(x=>x.artifact_type_label||x.file_name).join('\n')||'暂无产物'));}
function runTask(key){const map={stock_daily_capture:'daily-sync',indicators_build:'rebuild-indicators',factors_build:'rebuild-factors'};if(!map[key])return alert('该任务已登记，但执行处理器尚未接入');fetch('/api/data/jobs/'+map[key],{method:'POST'}).then(r=>r.json()).then(d=>{if(d.status!=='success')alert(d.error||'启动失败');else{alert(`任务已启动：#${d.run_id}`);loadTasks();}});}
async function loadTasks(){try{const d=await (await fetch('/api/task-center/overview')).json();if(d.status!=='success')throw new Error(d.error||'任务数据读取失败');state.tasks=d.tasks||[];const overview=d.overview||d.summary||{};const c=overview.run_counts||overview.counts||{};document.getElementById('task-kpis').innerHTML=[['任务定义',state.tasks.length,'已配置任务'],['已完成',overview.today_completed||c.success||0,'执行实例'],['执行中',overview.running||c.running||0,'执行实例'],['执行失败',overview.failed||c.failed||0,'需要关注'],['今日完成',overview.today_completed||0,'执行实例']].map(x=>`<div class="dm-kpi"><div class="dm-kpi-label">${x[0]}</div><div class="dm-kpi-value">${x[1]}</div><div class="dm-kpi-note">${x[2]}</div></div>`).join('');renderTasks();document.getElementById('task-refresh').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});}catch(error){document.getElementById('task-list').innerHTML=`<div class="dm-empty">${esc(error.message||'任务数据读取失败')}，请刷新重试</div>`;}}
</script>
{% endblock %}
