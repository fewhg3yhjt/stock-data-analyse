{% extends "base.html" %}
{% block title %}任务中心{% endblock %}
{% block head %}<link rel="stylesheet" href="/static/data-module.css?v=3">{% endblock %}
{% block body %}
<div class="dm-page">
  <aside class="dm-sidebar"><div class="dm-brand"><div class="dm-brand-mark"><i class="fas fa-chart-line"></i></div><div><strong>量化星球</strong><span>数据智能平台</span></div></div><div class="dm-side-label">工作台</div><nav class="dm-side-nav"><a href="/workbench"><i class="fas fa-border-all"></i>工作台</a><a href="/market"><i class="fas fa-compass"></i>市场发现</a><a href="/analyze"><i class="fas fa-chart-column"></i>个股分析</a><a href="/watch-pool"><i class="far fa-star"></i>观察池</a><a href="/data-center"><i class="fas fa-database"></i>数据中心</a><a class="active" href="/data-center/tasks"><i class="fas fa-list-check"></i>任务中心</a></nav><div class="dm-side-bottom"><div class="dm-user"><span class="dm-avatar"><i class="fas fa-user"></i></span><span>量化研究员</span></div><div class="dm-side-actions"><i class="fas fa-bell"></i><i class="fas fa-gear"></i><i class="fas fa-right-from-bracket"></i></div></div></aside>
  <main class="dm-main"><header class="dm-top"><div class="dm-title"><h1>任务中心</h1><p>管理任务配置、执行周期、运行进度和生成结果</p></div><div class="dm-top-actions"><span class="dm-refresh">最近刷新 <b id="task-refresh">--:--</b> <i class="fas fa-rotate"></i></span><button class="dm-btn" onclick="loadTasks()">刷新</button><button class="dm-btn primary">+ 新建任务</button></div></header><nav class="dm-tabs"><a href="/data-center">数据总览</a><a href="/data-center/assets">数据资产</a><a class="active" href="/data-center/tasks">任务中心</a></nav><section class="dm-kpis" id="task-kpis"></section><section class="dm-card"><div class="dm-card-head"><h2>任务列表</h2><div class="dm-toolbar"><select class="dm-select" id="task-stage" onchange="renderTasks()"><option value="">全部阶段</option><option value="CAPTURE">数据采集</option><option value="BUILD">数据构建</option><option value="QUALITY">数据质量</option><option value="PUBLISH">数据发布</option><option value="DERIVED">派生计算</option></select><select class="dm-select" id="task-status" onchange="renderTasks()"><option value="">全部状态</option><option value="running">执行中</option><option value="success">已完成</option><option value="failed">执行失败</option></select><input class="dm-input" id="task-search" placeholder="搜索任务" oninput="renderTasks()"></div></div><div class="dm-table-wrap"><div id="task-list"><div class="dm-empty">读取中...</div></div></div><div class="dm-note task-note">任务配置保存后不会立即改变运行行为，只有显式生效的配置版本才会被调度使用。</div></section></main>
</div>
<script>
const state={tasks:[]};const stageNames={CAPTURE:'数据采集',BUILD:'数据构建',QUALITY:'数据质量',PUBLISH:'数据发布',DERIVED:'派生计算'};const typeNames={SOURCE_CAPTURE:'源数据采集',DATA_BUILD:'标准数据构建',QUALITY_CHECK:'数据质量检查',DATA_PUBLISH:'数据正式发布',INDICATOR_BUILD:'技术指标计算',FACTOR_BUILD:'研究因子计算'};const statusNames={running:'执行中',success:'已完成',partial_success:'部分完成',failed:'执行失败',disabled:'未启用'};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function renderTasks(){const stage=document.getElementById('task-stage').value,status=document.getElementById('task-status').value,q=document.getElementById('task-search').value.toLowerCase();const list=state.tasks.filter(x=>(!stage||x.stage===stage)&&(!status||x.status===status)&&(!q||`${x.display_name} ${x.task_key}`.toLowerCase().includes(q)));document.getElementById('task-list').innerHTML=list.map(x=>`<div class="dm-task-group"><div class="dm-task-group-head">${esc(stageNames[x.stage]||x.stage)} <b>1</b></div><table class="dm-task-table"><thead><tr><th>任务名称</th><th>任务类型</th><th>执行周期</th><th>状态</th><th>最近结果</th><th>操作</th></tr></thead><tbody><tr><td><strong>${esc(x.display_name)}</strong><div class="dm-code">${esc(x.task_key)}</div></td><td>${esc(typeNames[x.task_type]||x.task_type)}</td><td>${x.enabled?'已启用':'未启用'}<div class="dm-code">配置 v${esc(x.active_config_version||'—')}</div></td><td>${x.enabled?'<span class="dm-health healthy">已接入调度</span>':'<span class="dm-health unknown">未启用调度</span>'}</td><td>查看执行记录</td><td><div class="dm-task-actions"><button class="dm-mini-btn" onclick="alert('任务详情和日志入口')">查看详情</button><button class="dm-mini-btn" onclick="alert('执行请求将在任务处理器接入后提交')">立即执行</button></div></td></tr></tbody></table></div>`).join('')||'<div class="dm-empty">没有匹配的任务</div>')}async function loadTasks(){const d=await (await fetch('/api/task-center/overview')).json();if(d.status!=='success')return;state.tasks=d.tasks||[];const c=d.overview?.counts||{};document.getElementById('task-kpis').innerHTML=[['任务总数',state.tasks.length,'已配置任务'],['已完成',c.success||0,'今日完成'],['执行中',c.running||0,'正在执行'],['执行失败',c.failed||0,'需要关注'],['今日完成',d.overview?.today_completed||0,'执行记录']].map(x=>`<div class="dm-kpi"><div class="dm-kpi-label">${x[0]}</div><div class="dm-kpi-value">${x[1]}</div><div class="dm-kpi-note">${x[2]}</div></div>`).join('');renderTasks();document.getElementById('task-refresh').textContent=new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})}loadTasks();setInterval(loadTasks,30000);
</script>
{% endblock %}
