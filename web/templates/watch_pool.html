{% extends "base.html" %}
{% block title %}StockInvestmentTool - 观察池{% endblock %}
{% block body %}
<main class="app">
  <header class="header"><div><h1><i class="fas fa-layer-group"></i> 观察池</h1><div class="sub">候选 → 观察 → 模拟 → 建仓，统一查看同一只股票的全部状态</div></div>{% set active = 'watchpool' %}{% include '_nav.html' %}</header>
  <section class="card"><div class="card-title"><span><i class="fas fa-route"></i> 状态流</span><button class="btn btn-outline btn-sm" onclick="loadPool(true)">刷新观察数据</button></div><div class="note">数据来源会合并手动观察、策略选入、模拟记录和当前持仓；真实建仓仍进入持仓事务流程。</div></section>
  <section class="card"><div class="table-wrap"><table><thead><tr><th>股票</th><th>来源</th><th>观察</th><th>模拟</th><th>持仓</th><th>下一步</th><th>操作</th></tr></thead><tbody id="pool-rows"><tr><td colspan="7" class="empty">加载中...</td></tr></tbody></table></div></section>
</main>
<script>
const nextLabels={simulate:'进入模拟',buy:'进入建仓',review:'查看持仓',none:'无需操作'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(items){document.getElementById('pool-rows').innerHTML=items.length?items.map(i=>`<tr><td><strong>${esc(i.name)}</strong><br><span class="note">${esc(i.code)}</span></td><td>${(i.sources||[]).map(s=>`<span class="tag blue">${esc({manual:'手动',strategy:'策略',holding:'持仓'}[s]||s)}</span>`).join(' ')||'—'}</td><td>${i.watch?`观察起点 ${esc(i.watch.added_time||'—')}<br><span class="note">${esc(i.watch.notes||'无备注')}</span>`:'—'}</td><td>${i.simulation?`方案 ${esc(i.simulation.scheme_name)}<br>现价 ${esc(i.simulation.current_price||'—')}`:'—'}</td><td>${i.holding?`${esc(i.holding.total_shares)} 股<br>盈亏 ${esc(i.holding.unrealized_pnl_pct)}%`:'—'}</td><td><span class="tag ${i.next_action==='review'?'orange':i.next_action==='buy'?'green':'gray'}">${nextLabels[i.next_action]||i.next_action}</span></td><td><button class="btn btn-outline btn-sm" onclick="showDetail('${esc(i.code)}')">详情</button>${i.watch&&!i.simulation?` <button class="btn btn-primary btn-sm" onclick="simulate('${esc(i.code)}','${esc(i.name)}')">模拟</button>`:''}${i.simulation&&!i.holding?` <a class="btn btn-primary btn-sm" href="/portfolio/add?code=${encodeURIComponent(i.code)}&name=${encodeURIComponent(i.name)}">建仓</a>`:''}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">观察池暂无记录</td></tr>';}
async function loadPool(refresh){const r=await fetch('/api/watch-pool'+(refresh?'?refresh=1':''));const d=await r.json();if(d.status==='success')render(d.items||[]);else document.getElementById('pool-rows').innerHTML=`<tr><td colspan="7" class="error">${esc(d.error)}</td></tr>`;}
async function simulate(code,name){const r=await fetch('/api/simulation',{method:'POST',body:new URLSearchParams({code,name})});const d=await r.json();if(d.status==='success')loadPool();else alert(d.error||'模拟失败');}
function showDetail(code){window.open('/?code='+encodeURIComponent(code),'_blank');}
loadPool(false);
</script>
{% endblock %}
