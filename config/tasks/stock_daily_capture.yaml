task:
  key: stock_daily_capture
  display_name: 腾讯日线采集
  stage: CAPTURE
  type: SOURCE_CAPTURE
  input_datasets: [universe]
  output_datasets: [stock_daily]
  producer_metrics: [close, volume, amount]
scope:
  asset_types: [stock, etf]
  universe: active
schedule:
  enabled: true
  timezone: Asia/Shanghai
  frequency: trading_day
  time: "15:35"
  period_type: trading_day
  period_start: null
  period_end: null
execution:
  manual_enabled: true
  retry_limit: 2
  raw_run_date: period_end
  raw_subdir: _tmp
  raw_batch_size: 50
  auto_merge_effective: false
  pending_codes_path: null
policy:
  on_partial_success: continue
  on_failure: block_downstream
