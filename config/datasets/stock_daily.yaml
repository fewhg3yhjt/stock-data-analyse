dataset:
  name: stock_daily
  display_name: 日线数据
  description: 股票和 ETF 等证券每个交易日一条价格及成交事实记录
  grain: 一个证券的一个交易日
  primary_keys:
    - date
    - code
  partition:
    type: month
    path: warehouse/daily/{partition}.parquet
  update_frequency: 交易日收盘后
  schema_version: stock_daily.v1

fields:
  - name: date
    display_name: 交易日期
    data_type: date
    nullable: false
    primary_key: true
    description: 业务交易日
  - name: code
    display_name: 证券代码
    data_type: string
    nullable: false
    primary_key: true
    description: 标准证券代码
  - name: open
    display_name: 开盘价
    data_type: float
    unit: 元
    nullable: true
    description: 停牌或来源缺失时单独报告
  - name: high
    display_name: 最高价
    data_type: float
    unit: 元
    nullable: true
    description: 停牌或来源缺失时单独报告
  - name: low
    display_name: 最低价
    data_type: float
    unit: 元
    nullable: true
    description: 停牌或来源缺失时单独报告
  - name: close
    display_name: 收盘价
    data_type: float
    unit: 元
    nullable: false
    description: 正常交易记录必须大于 0
  - name: pre_close
    display_name: 前收盘价
    data_type: float
    unit: 元
    nullable: true
    description: 用于涨跌计算和校验
  - name: volume
    display_name: 成交量
    data_type: float
    unit: 股
    nullable: false
    description: 停牌允许为 0，不允许负数
  - name: amount
    display_name: 成交额
    data_type: float
    unit: 元
    nullable: false
    description: 停牌允许为 0，不允许负数
  - name: turn
    display_name: 换手率
    data_type: float
    unit: "%"
    nullable: true
    description: 来源缺失时允许为空
  - name: tradestatus
    display_name: 交易状态
    data_type: string/int
    nullable: true
    description: 用于停牌与缺口判断

sources:
  - name: tencent
    role: primary
    priority: 1
    field_mapping:
      date: date
      code: code
      open: open
      high: high
      low: low
      close: close
      volume: volume
      amount: amount
      turn: turn
    # Cleaning rules applied by DailyBuilder, never by Capture/Raw storage.
    unit_conversions:
      volume:
        hand_to_share: 100
        share_to_share: 1
      amount:
        wan_yuan_to_yuan: 10000
        yuan_to_yuan: 1
    unit_rules:
      - name: star_stock
        code_prefixes: [sh68]
        volume: share
        amount: wan_yuan
      - name: etf
        code_prefixes: [sh5, sz15, sz16, sz18]
        volume: hand
        amount: wan_yuan
      - name: stock
        default: true
        volume: hand
        amount: wan_yuan
      - name: legacy_standardized
        inference_only: true
        code_prefixes: [legacy]
        volume: share
        amount: yuan
    request_defaults:
      adjust: qfq
  - name: baostock
    role: validate + fallback
    priority: 2
    field_mapping: {date: date, code: code, open: open, high: high, low: low, close: close, pre_close: preclose, volume: volume, amount: amount, turn: turn, tradestatus: tradestatus, pe_ttm: "peTTM", pb_mrq: "pbMRQ"}
    unit_conversions:
      volume:
        share_to_share: 1
      amount:
        yuan_to_yuan: 1
    raw_units:
      volume: share
      amount: yuan
      resolution: source_contract_v1

consumers:
  - name: market_discovery
    type: business
    purpose: 全市场筛选
    required_quality: PASS/WARNING
    fallback_policy: 禁止在线逐证券回退
    blocked_actions: 正式扫描
  - name: indicators
    type: compute
    purpose: 指标计算
    required_quality: PASS/WARNING
    fallback_policy: 只读正式版本
    blocked_actions: 指标输入
  - name: stock_research
    type: research
    purpose: K 线分析
    required_quality: WARNING
    fallback_policy: 允许显式在线回退
    blocked_actions: 研究查看
  - name: position_advice
    type: business
    purpose: 正式决策
    required_quality: PASS
    fallback_policy: 禁止静默回退
    blocked_actions: 建仓建议

quality:
  publish_warning: true
  unit_consistency:
    implied_amount_volume_close_min: 0.2
    implied_amount_volume_close_max: 5.0
    exceptions:
      - name: sz159582_july_2026
        codes: [sz159582]
        dates: [2026-07-01, 2026-07-02, 2026-07-10]
        max: 10.0
        reason: 历史 ETF 成交量口径与相邻交易日呈稳定连续偏移
      - name: june_2026_etf_historical_scale
        codes: [sh561980, sz159582]
        dates: [2026-06-01, 2026-06-03, 2026-06-05, 2026-06-08, 2026-06-10, 2026-06-12, 2026-06-23]
        max: 10.0
        reason: 历史 ETF 成交量口径与相邻交易日呈稳定连续偏移
      - name: may_2026_etf_historical_scale
        codes: [sh561980, sz159582]
        dates: [2026-05-06, 2026-05-08, 2026-05-14, 2026-05-18, 2026-05-21, 2026-05-27, 2026-05-29]
        max: 10.0
        reason: 历史 ETF 成交量口径与相邻交易日呈稳定连续偏移
  coverage:
    pass_min: 0.995
    warning_min: 0.98
  duplicates:
    fail_if_gt: 0
  ohlc:
    fail_if_invalid_gt: 0
  source_conflict:
    warning_ratio: 0.001
    fail_ratio: 0.01
