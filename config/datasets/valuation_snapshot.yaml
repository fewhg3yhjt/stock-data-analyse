dataset:
  name: valuation_snapshot
  display_name: 腾讯估值快照
  description: 腾讯批量报价中的价格、市值和源估值字段
  grain: 一个证券一个交易日
  primary_keys: [trade_date, code]
  partition: {type: snapshot, path: "warehouse/raw/valuation_snapshot/{partition}.parquet"}
  update_frequency: 交易日收盘后
  schema_version: valuation_snapshot.v1
fields:
  - {name: trade_date, display_name: 交易日期, data_type: date, nullable: false, primary_key: true}
  - {name: code, display_name: 证券代码, data_type: string, nullable: false, primary_key: true}
  - {name: name, display_name: 名称, data_type: string, nullable: true}
  - {name: price, display_name: 价格, data_type: float, nullable: true}
  - {name: total_mv, display_name: 总市值, data_type: float, nullable: true}
  - {name: circ_mv, display_name: 流通市值, data_type: float, nullable: true}
  - {name: pe_ttm_source, display_name: 源市盈率TTM, data_type: float, nullable: true}
  - {name: pb_source, display_name: 源市净率, data_type: float, nullable: true}
  - {name: turnover, display_name: 换手率, data_type: float, nullable: true}
  - {name: volume_ratio, display_name: 量比, data_type: float, nullable: true}
  - {name: price_source, display_name: 价格来源, data_type: string, nullable: false}
  - {name: captured_at, display_name: 采集时间, data_type: datetime, nullable: false}
  - {name: is_stale, display_name: 是否过期, data_type: boolean, nullable: false}
sources:
  - {name: tencent_quotes, role: primary, priority: 1, field_mapping: {}, unit_conversions: {亿元: 元}}
consumers:
  - {name: valuation_builder, type: research, purpose: 估值计算, required_quality: WARNING, fallback_policy: no_fallback, blocked_actions: 正式决策}
quality: {publish_warning: true, coverage: {pass_min: 0.98, warning_min: 0.95}}
