rules:
- id: actionable_intraday
  name: 盘中操作建议（即时）
  enabled: false
  conditions:
  - type: action
    params:
      advice_types:
      - partial_sell
      - sell_all
      - buy_more
      - adjust_stop
  logic: AND
  schedule:
    mode: intraday
    interval_minutes: 10
  channel: email
  priority: instant
- id: post_close_summary
  name: 盘后持仓汇总（批次）
  enabled: false
  conditions:
  - type: action
    params:
      advice_types:
      - hold
      - partial_sell
      - sell_all
      - buy_more
  logic: OR
  schedule:
    mode: post_close
    time: '15:35'
  channel: email
  priority: batch
- id: price_threshold
  name: 自选价格阈值（批次）
  enabled: false
  conditions:
  - type: action
    params:
      advice_types:
      - hold
  logic: AND
  schedule:
    mode: post_close
    time: '15:35'
  channel: email
  priority: batch
- id: notification_daily_report
  name: 每日盘后汇总
  enabled: false
  kind: notification_subscription
  event_type: DAILY_REPORT
  conditions: []
  logic: AND
