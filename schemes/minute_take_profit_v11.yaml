name: "minute_take_profit_v11"
version: "11.0"
description: "分钟级趋势止盈 V11：有效回撤与结构反转确认后通知，当前仅 shadow/notify，不自动卖出"
applicable_types: ["A", "B", "C", "D", "E"]

strategy_spec:
  输入数据: "当天腾讯分钟 close、volume、amount；前一交易日 Published 日线 close 与 ATR14；持仓均价"
  盘中基准: "day_open=当天第一根分钟 close；running_high/low=当天分钟 close 路径极值；current_price=当天最后一根分钟 close"
  第一关_盈利: "只有 current_price > 持仓均价时才进入止盈路径；亏损时不触发止盈"
  第二关_回撤候选: "(running_high-current_price) ÷ 前一交易日 ATR14 >= candidate_atr（默认0.75）"
  第三关_结构确认: "有效分钟路径出现 Lower High + Lower Low 才进入 TAKE_PROFIT；仅跌破开盘、Lower High、Lower Low 或放量走弱时进入 TAKE_PROFIT_PENDING"
  亏损路径: "未盈利且出现 Lower Low 或跌破开盘时标记 STOP_LOSS；仍然只通知，不自动卖出"
  放量走弱: "最近3根分钟成交额 > 最近20根均值 × volume_surge_ratio（默认1.8），且当前价低于盘中高点"
  执行动作: "状态首次进入 TAKE_PROFIT_PENDING、TAKE_PROFIT 或 STOP_LOSS 时生成一次通知；不自动下单"
  当前限制: "confirmation_bars 是可配置入口，当前实现以有效路径结构为主，不保证连续N根分钟线硬确认；无当天分钟数据时为 DATA_UNAVAILABLE"

buy_rules: []

sell_rules:
  - type: "minute_take_profit_v11"
    params:
      mode: "notify"
      candidate_atr: 0.75
      swing_atr: 0.75
      confirmation_bars: 3
      volume_surge_ratio: 1.8
      auto_sell: false

risk:
  stop_loss_by_type: {A: 0.18, B: 0.18, C: 0.18, D: 0.12}
  volume_surge_threshold: 1.8
  technical_stop_enabled: true
  drawdown_stop: 0.10
  min_profit_for_dd: 0.06

backtest:
  initial_cash: 100000
  optimize: false
