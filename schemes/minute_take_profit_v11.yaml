name: "minute_take_profit_v11"
version: "11.0"
description: "分钟级趋势止盈 V11：有效回撤与结构反转确认后通知，当前仅 shadow/notify，不自动卖出"
applicable_types: ["A", "B", "C", "D", "E"]

strategy_spec:
  一句话: "它不是自动卖出策略，而是盘中盯着已经盈利的持仓；如果上涨后出现足够回撤并确认转弱，就发一封止盈提醒。"
  什么时候开始判断: "只有当前价高于持仓均价（当前处于盈利）时，才会进入止盈判断；亏损持仓不会因为V11触发止盈。"
  先看回撤: "把当天盘中最高收盘价与当前价比较；回撤达到前一交易日ATR14的0.75倍，才进入‘可能需要止盈’观察阶段。"
  再看走势: "观察分钟收盘价是否先后形成更低的高点和更低的低点；这表示上涨结构正在转弱。"
  状态说明: "观察中=盈利但回撤还不够；止盈候选=回撤够了但还没有完整转弱；止盈待确认=出现部分转弱迹象，继续观察；止盈提醒=回撤和转弱结构都确认；风险提醒=未盈利但出现明显走弱。"
  什么会触发待确认: "回撤达到门槛后，只要出现跌破当天开盘价、形成更低高点、形成更低低点、或放量下跌中的任一迹象，就进入止盈待确认。它不是卖出信号，只是提醒系统继续盯盘。"
  什么会触发止盈提醒: "回撤达到门槛，并且分钟走势同时确认‘高点越来越低’和‘低点越来越低’；这才进入止盈提醒状态。"
  ATR解释: "ATR是平均真实波动幅度，用来衡量这只股票平时一天大约波动多少钱。用ATR而不是固定几分钱，可以让不同价格和波动大小的股票使用相对合理的回撤门槛。"
  放量解释: "最近3根分钟成交额超过最近20根分钟成交额均值的1.8倍，并且当前价低于盘中高点，视为放量走弱；它只会让状态进入待确认，不会单独触发卖出。"
  分钟数据: "使用当天腾讯分钟收盘价、成交量、成交额；没有当天分钟数据时显示‘等待分钟数据’，不会拿旧数据冒充实时判断。"
  通知与卖出: "状态第一次进入止盈待确认、止盈提醒或风险提醒时发送一次邮件；策略永远不会自动下单或卖出。"
  参数提示: "结构确认根数目前是预留参数，页面可以保存，但当前实现主要根据有效分钟路径的高低点结构判断，不等于连续3根K线硬确认。"

buy_rules: []

sell_rules:
  - type: "minute_take_profit_v11"
    params:
      mode: "notify"
      candidate_atr: 0.75
      swing_atr: 0.75
      confirmation_bars: 3
      volume_surge_ratio: 1.8
      auto_sell: false

risk:
  stop_loss_by_type: {A: 0.18, B: 0.18, C: 0.18, D: 0.12}
  volume_surge_threshold: 1.8
  technical_stop_enabled: true
  drawdown_stop: 0.10
  min_profit_for_dd: 0.06

backtest:
  initial_cash: 100000
  optimize: false
